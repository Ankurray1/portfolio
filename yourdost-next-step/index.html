<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourDOST Next Step</title>
<meta name="description" content="Prototype: an AI guide that helps an employee find the right next step for their mental wellbeing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --page:#ece9e0;--app:#f7f5ef;--card:#fffdf8;--soft:#f0ede5;--ink:#2f4246;--muted:#6e8185;--line:#e2ded3;
  --teal:#4f8a83;--teal-ink:#fff;--teal-soft:#dcede8;--teal-deep:#2f6159;
  --peach:#f4dfcd;--peach-ink:#8a5a33;--lav:#e2dcf0;--lav-ink:#5d4f86;--sky:#d7e4f2;--sky-ink:#3f5f86;
  --rose:#b9606e;--rose-soft:#f6e1e4;
  --serif:"Fraunces",Georgia,serif;--sans:"Onest","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#121b1c;--app:#172325;--card:#1e2d2f;--soft:#253739;--ink:#e2ecea;--muted:#9db2b2;--line:#304446;
  --teal:#7fbdb4;--teal-ink:#12302c;--teal-soft:#28463f;--teal-deep:#b6dfd3;
  --peach:#4a3a2c;--peach-ink:#efc9a6;--lav:#3a3550;--lav-ink:#d2c9f0;--sky:#2b3b50;--sky-ink:#bcd2ee;
  --rose:#e3a0b3;--rose-soft:#4a2c33;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121b1c;--app:#172325;--card:#1e2d2f;--soft:#253739;--ink:#e2ecea;--muted:#9db2b2;--line:#304446;
  --teal:#7fbdb4;--teal-ink:#12302c;--teal-soft:#28463f;--teal-deep:#b6dfd3;--peach:#4a3a2c;--peach-ink:#efc9a6;--lav:#3a3550;--lav-ink:#d2c9f0;
  --sky:#2b3b50;--sky-ink:#bcd2ee;--rose:#e3a0b3;--rose-soft:#4a2c33;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}

.stage{min-height:100%;display:flex;gap:36px;align-items:center;justify-content:center;padding:28px 20px}
.phone{width:390px;height:min(820px,calc(100vh - 56px));min-height:620px;background:var(--app);border:8px solid var(--card);border-radius:44px;box-shadow:0 30px 60px -30px rgba(47,66,70,.35);display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none}
.side{width:300px;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 8px;flex:none}
.brand{display:flex;gap:8px;align-items:center;font-weight:600}
.logo{width:26px;height:26px;border-radius:9px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-size:14px}
.back{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px}
.human{font-size:13px;font-weight:600;color:var(--teal-deep);background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.screen{flex:1;overflow:auto;padding:4px 18px 22px}
.in{animation:in .3s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--teal);color:var(--teal-ink);font-weight:600}
.btn.block{width:100%}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--teal-deep)}.btn.rose{background:var(--rose);color:#fff}
.link{color:var(--teal-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}

/* home */
.hello{font-size:28px;margin:8px 0 2px}
.hero{background:linear-gradient(160deg,var(--teal-soft),var(--card) 70%);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:18px}
.hero h2{font-size:23px;margin-bottom:6px}.hero p{margin:0 0 16px;color:var(--muted)}
.lock{font-size:12.5px;color:var(--muted);margin-top:12px}
.label{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left}
.tile b{display:block;font-weight:600;font-size:14px;margin-top:8px}.tile span{font-size:12px;color:var(--muted)}
.dot{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:15px}
.k-counsellor{background:var(--lav);color:var(--lav-ink)}.k-program{background:var(--peach);color:var(--peach-ink)}
.k-selfhelp{background:var(--teal-soft);color:var(--teal-deep)}.k-assessment{background:var(--sky);color:var(--sky-ink)}
.plan{display:flex;gap:12px;align-items:center}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;animation:in .25s ease both;white-space:pre-wrap}
.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.me{background:var(--teal);color:var(--teal-ink);border-bottom-right-radius:6px;align-self:flex-end}
.note{align-self:center;font-size:12.5px;color:var(--muted)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;color:var(--teal-deep)}
.offer{align-self:stretch;background:var(--rose-soft);border-radius:18px;padding:14px;animation:in .25s both}
.offer b{display:block;margin-bottom:8px}
.composer{display:flex;gap:8px;padding:10px 14px 16px;border-top:1px solid var(--line);flex:none}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:11px 16px;min-height:44px;max-height:110px;outline:none}
.composer textarea:focus{border-color:var(--teal)}
.send{width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--teal-ink);font-size:18px;flex:none}
.send:disabled,.composer textarea:disabled{opacity:.5}

/* result */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.tag{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--soft)}
.step{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.step-top{padding:20px 20px 14px}
.kind{display:inline-block;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.step h2{font-size:24px;margin:12px 0 4px}
.why{margin:0 20px;padding:14px 16px;border-radius:18px;background:var(--soft);font-size:14.5px}
.why b{display:block;font-size:12px;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.acts{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px}
.alt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.alt b{display:block;font-weight:600;font-size:14px}.alt span{font-size:12.5px;color:var(--muted)}
.rate{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.rate button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:17px}

/* activities */
.orb{width:190px;height:190px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 40% 35%,var(--teal-soft),#bcd3c5);display:grid;place-items:center;font-family:var(--serif);font-size:19px;color:var(--teal-deep);transition:transform 4s ease-in-out}
.orb.big{transform:scale(1.15)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip.on{background:var(--teal-soft);border-color:var(--teal)}
.consent{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--soft);margin:6px 0 16px;cursor:pointer}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:.2s}.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--teal)}.sw.on::after{left:21px}
.sum{font-size:13px;border-left:3px solid var(--teal);padding:4px 10px;margin-top:8px}
.big-ic{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin:28px auto 14px;background:var(--teal-soft);color:var(--teal-deep)}
.center{text-align:center}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-top:10px;text-decoration:none;color:inherit}
.opt b{display:block;font-weight:600}.opt span{font-size:13px;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(30,45,47,.35);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--app);width:100%;border-radius:28px 28px 0 0;padding:18px 20px 26px;animation:in .25s both}

/* side panel */
.side h1{font-size:26px;margin:6px 0 8px}.side p{font-size:14px;color:var(--muted);margin:0 0 14px}
.side ol{padding-left:18px;margin:0 0 16px;font-size:14px;line-height:1.6}
.sample{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;font-size:13.5px}
.sample b{display:block;font-weight:600}.sample span{color:var(--muted);font-size:12.5px}
.side .foot{display:flex;gap:8px;margin-top:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
@media (max-width:820px){.stage{padding:0;display:block}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.side{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <main class="phone" id="phone">
    <div class="top" id="top"></div>
    <div class="screen" id="screen"></div>
    <div id="bottom"></div>
  </main>
  <aside class="side">
    <div class="eyebrow">YOURDOST · TASK 3 PROTOTYPE</div>
    <h1>Next Step</h1>
    <p>A real AI (gpt-4.1-mini) reads how you feel and suggests one next step from YourDOST. All names and data are fictional.</p>
    <ol>
      <li>Tap <b>Find my next step</b></li>
      <li>Say how you feel, answer 1–2 taps</li>
      <li>Get one step + why, then start it</li>
    </ol>
    <button class="sample" data-s="Work has been crazy for 3 weeks. My manager keeps adding deadlines and I can't sleep, my mind keeps racing at night."><b>Try: work stress + sleep</b><span>Main journey</span></button>
    <button class="sample" data-s="Kuch mahine se mann nahi lagta. I feel low most days and I've stopped meeting friends."><b>Try: feeling low (Hinglish)</b><span>Usually leads to a counsellor</span></button>
    <button class="sample" data-s="Honestly I don't see the point anymore. Sometimes I don't want to be here."><b>Try: safety path</b><span>AI steps out, a human steps in</span></button>
    <div class="foot"><button class="btn ghost" id="reset">Start over</button><button class="btn ghost" id="theme">Light / dark</button></div>
  </aside>
</div>

<script>
const API = 'https://zzkppvuedkkcdocmisje.supabase.co/functions/v1/next-step';
const NAME = 'Riya';
const ICON = { counsellor:'💬', program:'🌱', selfhelp:'🍃', assessment:'✓' };
const KIND = { counsellor:'Talk to a counsellor', program:'Guided program', selfhelp:'Self-help', assessment:'Assessment' };
const RISK = /(kill myself|end (it all|my life)|suicid|don'?t want to (live|be here|exist|wake up)|not want to be here|hurt(ing)? myself|self[- ]?harm|cut myself|no reason to live|better off without me|don'?t see the point (anymore|of living)|want to disappear|marna chaht|mar jaana|jeena nahi|khud ko (nuksan|khatam))/i;
const isRisk = t => RISK.test(String(t).replace(/[‘’ʼ`´]/g, "'"));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

let S = { history: [], rec: null, plan: null, run: 0, thumbsDown: 0 };
fetch(API).catch(() => {}); // wake the backend

/* ---------- frame ---------- */
function show(html, { back = true, composer = false } = {}){
  $('#top').innerHTML = (back ? `<button class="back" aria-label="Back" onclick="home()">‹</button>` : `<div class="brand"><span class="logo">✦</span>yourdost</div>`)
    + `<button class="human" onclick="humanSheet()">♡ Talk to a person</button>`;
  $('#screen').innerHTML = html; $('#screen').scrollTop = 0;
  $('#bottom').innerHTML = composer ? `<div class="composer"><textarea id="ta" rows="1" placeholder="Type how you feel…" aria-label="Message"></textarea><button class="send" id="send" aria-label="Send">➜</button></div>` : '';
  if (composer){
    const ta = $('#ta');
    $('#send').onclick = () => sendText(ta.value);
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(ta.value); } };
    ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(110, ta.scrollHeight) + 'px'; };
  }
}

/* ---------- 1. home ---------- */
function home(){
  S.run++;
  const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  show(`<div class="in">
    <h1 class="hello">${hi}, ${NAME}</h1><div class="muted">How are you, really?</div>
    ${S.plan ? `<div class="label">YOUR PLAN</div>
      <div class="card plan"><span class="dot k-${S.plan.kind}">${ICON[S.plan.kind]}</span><div><b style="font-weight:600">${esc(S.plan.title)}</b><div class="small muted">${esc(S.plan.status)}</div></div></div>
      <div class="small muted" style="margin-top:8px">I’ll check in with you in a few days to see if it helped.</div>` : ''}
    <div class="hero">
      <h2>${S.plan ? 'Something else on your mind?' : 'Not sure where to start?'}</h2>
      <p>Tell me how you feel. I’ll suggest one small next step that fits.</p>
      <button class="btn" onclick="chat()">Find my next step</button>
      <div class="lock">🔒 Private. Your company never sees this.</div>
    </div>
    <div class="label">EVERYTHING ON YOURDOST</div>
    <div class="grid">
      <button class="tile" onclick="humanSheet()"><span class="dot k-counsellor">💬</span><b>Counselling</b><span>Chat, call or video</span></button>
      <button class="tile" onclick="chat()"><span class="dot k-selfhelp">🍃</span><b>Self-help</b><span>Audio and reads</span></button>
      <button class="tile" onclick="chat()"><span class="dot k-assessment">✓</span><b>Assessments</b><span>Know where you are</span></button>
      <button class="tile" onclick="chat()"><span class="dot k-program">🌱</span><b>Programs</b><span>Short daily paths</span></button>
    </div></div>`, { back:false });
}

/* ---------- 2. chat ---------- */
function chat(seed){
  S.run++; S.history = []; S.rec = null;
  show(`<div class="msgs" id="msgs"><div class="note">🔒 Only you can see this chat</div></div>`, { composer:true });
  const run = S.run;
  bot(`Hi ${NAME} 🌿 What’s been on your mind lately? Write it any way you like, English or Hinglish.`, run).then(() => {
    if (seed) return sendText(seed);
    chips(['Work stress','Can’t sleep','Feeling low','Not sure, just off'], run);
  });
}
function add(cls, html){ const m = document.createElement('div'); m.className = cls; m.innerHTML = html; $('#msgs').appendChild(m); $('#screen').scrollTop = 1e6; return m; }
async function bot(text, run){
  const t = add('msg bot', '<span class="typing"><i></i><i></i><i></i></span>');
  await wait(450); if (run !== S.run) return; t.textContent = text; $('#screen').scrollTop = 1e6;
}
function chips(list, run){
  if (!list?.length) return;
  const w = add('chips', list.map(o => `<button class="chip">${esc(o)}</button>`).join(''));
  w.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (run === S.run){ w.remove(); sendText(b.textContent); } });
}
function lock(on){ const ta = $('#ta'), s = $('#send'); if (ta){ ta.disabled = on; s.disabled = on; if (!on) ta.focus({ preventScroll:true }); } }

async function sendText(raw){
  const text = String(raw || '').trim(); if (!text || !$('#msgs')) return;
  const run = S.run;
  $('#ta').value = ''; $('#msgs').querySelectorAll('.chips').forEach(c => c.remove());
  add('msg me', esc(text));
  S.history.push({ role:'user', content:text });
  // safety: checked on the phone first; risky text is never sent to the AI
  if (isRisk(text)) return crisis();
  lock(true);
  const t = add('msg bot', '<span class="typing"><i></i><i></i><i></i></span>');
  let r;
  try {
    const res = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ messages: S.history }) });
    r = await res.json();
  } catch { r = { type:'error', reply:'Sorry, I couldn’t reach my brain just now. You can try again, or talk to a counsellor.' }; }
  if (run !== S.run) return;
  t.remove(); lock(false);
  if (r.type === 'risk') return crisis();
  if (r.type === 'error' || r.type === 'invalid' || !r.reply && r.type !== 'recommend'){
    add('msg bot', esc(r.reply || 'Sorry, something went wrong.'));
    return offerHuman('You don’t have to wait for me.');
  }
  S.history.push({ role:'assistant', content: r.reply || '' });
  if (r.reply) add('msg bot', esc(r.reply));
  if (r.frustrated) offerHuman('Sounds like this isn’t helping. Want a real person instead?');
  if (r.type === 'recommend'){ S.rec = r; await wait(900); if (run === S.run) result(); return; }
  chips(r.options, run);
}
function offerHuman(title){
  add('offer', `<b>${esc(title)}</b><button class="btn rose" onclick="connecting()">Chat with a counsellor now</button>`);
}

/* ---------- 3. one next step ---------- */
function result(){
  const { item, why, backups = [], understood = {} } = S.rec;
  const heard = [...(understood.topics || []), understood.duration, understood.impact].filter(x => x && String(x).length < 40);
  show(`<div class="in">
    <div class="small muted" style="margin-top:6px">Based on what you shared</div>
    <h1 class="hello" style="font-size:26px">Your next step</h1>
    <div class="tags">${heard.map(h => `<span class="tag">${esc(h)}</span>`).join('')}</div>
    <div class="step">
      <div class="step-top"><span class="kind k-${item.kind}">${ICON[item.kind]} ${KIND[item.kind]}</span>
        <h2>${esc(item.title)}</h2><div class="small muted">${esc(item.meta)}</div></div>
      <div class="why"><b>WHY THIS</b>${esc(why)}</div>
      <div class="acts">
        <button class="btn block" onclick="start(S.rec.item)">${item.kind === 'counsellor' ? 'Pick a time' : item.kind === 'assessment' ? 'Take the check' : 'Start now'}</button>
        ${backups.length ? `<button class="btn ghost block" onclick="document.getElementById('alts').hidden=false;this.remove()">See ${backups.length} other option${backups.length > 1 ? 's' : ''}</button>` : ''}
      </div>
    </div>
    <div id="alts" hidden>${backups.map((b,i) => `<button class="alt" onclick="pickAlt(${i})"><span class="dot k-${b.kind}">${ICON[b.kind]}</span><div><b>${esc(b.title)}</b><span>${KIND[b.kind]} · ${esc(b.meta)}</span></div></button>`).join('')}</div>
    <div class="rate" id="rate">Was this helpful? <button aria-label="Helpful" onclick="rate(1)">👍</button><button aria-label="Not helpful" onclick="rate(-1)">👎</button></div>
  </div>`);
}
function pickAlt(i){
  const b = S.rec.backups[i];
  S.rec = { ...S.rec, backups:[S.rec.item, ...S.rec.backups.filter((_,j) => j !== i)], item:b, why:'You picked this one. That’s a good sign: choosing your own step helps you stick with it.' };
  result();
}
function rate(v){
  if (v > 0){ $('#rate').innerHTML = 'Thanks! Glad it fits.'; return; }
  S.thumbsDown++;
  sheet(`<h2 style="font-size:21px">Sorry it missed</h2><p class="muted" style="margin:6px 0 4px">What would help more?</p>
    <button class="opt" onclick="closeSheet();connecting()"><span class="dot k-counsellor">💬</span><div><b>Talk to a counsellor</b><span>A real person, usually in under 10 minutes</span></div></button>
    <button class="opt" onclick="closeSheet();chat()"><span class="dot k-selfhelp">✎</span><div><b>Tell the guide more</b><span>Start again in your own words</span></div></button>`);
}

/* ---------- 4. start the step ---------- */
function start(item){
  if (item.kind === 'counsellor') return book(item);
  if (item.kind === 'assessment') return assess(item);
  const program = item.kind === 'program';
  show(`<div class="in"><span class="kind k-${item.kind}">${ICON[item.kind]} ${KIND[item.kind]}</span>
    <h1 class="hello" style="font-size:25px;margin-top:12px">${esc(item.title)}</h1>
    <div class="muted">${program ? 'Day 1 · ' : ''}${esc(item.meta)}</div>
    <div class="orb" id="orb">Breathe in</div>
    <p class="center muted small">${program ? 'Today: notice how your body feels, without fixing anything.' : 'Follow the circle. Even one minute counts.'}</p>
    <button class="btn block" onclick="done(${program ? "'Day 1 done'" : "'Done today'"})">${program ? 'Finish day 1' : 'I’m done'}</button></div>`);
  let n = 0; const orb = $('#orb');
  const tick = () => { if (!orb.isConnected) return clearInterval(iv); orb.textContent = ['Breathe in','Hold','Breathe out'][n % 3]; orb.classList.toggle('big', n % 3 !== 2); n++; };
  tick(); const iv = setInterval(tick, 4000);
}
function book(item){
  const u = S.rec?.understood || {};
  const summary = [(u.topics || []).join(', ') || 'Wants to talk', u.duration, u.impact, u.preference].filter(Boolean);
  let share = true;
  show(`<div class="in"><span class="kind k-counsellor">💬 ${KIND.counsellor}</span>
    <h1 class="hello" style="font-size:24px;margin-top:12px">${esc(item.title)}</h1><div class="small muted">${esc(item.meta)}</div>
    <div class="label">PICK A TIME</div>
    <div class="slots" id="slots">${['Today 7:30 pm','Tomorrow 8:00 am','Tomorrow 6:00 pm'].map((s,i) => `<button class="chip ${i ? '' : 'on'}">${s}</button>`).join('')}</div>
    <div class="consent" id="consent" role="switch" aria-checked="true" tabindex="0"><span class="sw on" id="sw"></span>
      <div><b style="font-weight:600;font-size:14px">Share a short note with your counsellor</b><div class="small muted">So you don’t have to repeat your story.</div>
      <div class="sum" id="sum">${summary.map(esc).join(' · ')}</div></div></div>
    <button class="btn block" id="bk">Book free session</button></div>`);
  document.querySelectorAll('#slots .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#slots .chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); });
  const flip = () => { share = !share; $('#sw').classList.toggle('on', share); $('#sum').style.display = share ? '' : 'none'; $('#consent').setAttribute('aria-checked', share); };
  $('#consent').onclick = flip; $('#consent').onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); } };
  $('#bk').onclick = () => done('Booked · ' + $('#slots .on').textContent, item);
}
function assess(item){
  const Q = ['How has your sleep been?','How is your energy most days?','Can you focus at work?','How often do you worry?','How connected do you feel to people?'];
  const A = ['Good','Okay','Not great','Really hard'], ans = [];
  const ask = i => {
    if (i === Q.length){
      const text = 'My wellbeing check answers: ' + Q.map((q,j) => q.replace('?','') + ': ' + A[ans[j]]).join('; ') + '. What should I do next?';
      chat(text); return;
    }
    show(`<div class="in"><span class="kind k-assessment">✓ ${esc(item.title)} · ${i+1} of ${Q.length}</span>
      <h1 class="hello" style="font-size:25px;margin:18px 0 6px">${Q[i]}</h1><div class="muted">Over the last 2 weeks</div>
      ${A.map((a,k) => `<button class="opt" data-k="${k}"><b>${a}</b></button>`).join('')}</div>`);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => { ans.push(+b.dataset.k); ask(i+1); });
  };
  ask(0);
}
function done(status, item = S.rec?.item){
  S.plan = { ...item, status };
  show(`<div class="in center"><div class="big-ic">♡</div><h1 class="hello" style="font-size:26px">That’s a good step</h1>
    <p class="muted">Saved to your plan. I’ll check in with you in a few days to see if it helped.</p>
    <button class="btn block" onclick="home()">Back to home</button></div>`);
}

/* ---------- human support ---------- */
function crisis(){
  S.run++;
  show(`<div class="in"><span class="kind" style="background:var(--rose-soft);color:var(--rose)">♡ You matter</span>
    <h1 class="hello" style="font-size:27px;margin:12px 0 8px">You don’t have to go through this alone</h1>
    <p class="muted" style="margin:0">Thank you for telling me. Let’s get you to a real person now.</p>
    <button class="opt" style="border-color:var(--rose)" onclick="connecting()"><span class="dot" style="background:var(--rose);color:#fff">💬</span><div><b>Talk to a counsellor now</b><span>Chat or call · usually under 5 minutes</span></div></button>
    <a class="opt" href="tel:14416"><span class="dot k-counsellor">☎</span><div><b>Call Tele-MANAS 14416</b><span>Free, 24×7 government helpline</span></div></a>
    <a class="opt" href="tel:112"><span class="dot k-program">!</span><div><b>In danger right now? Call 112</b><span>Emergency services</span></div></a>
    <div class="center"><button class="link" onclick="home()">I’m safe for now</button></div></div>`);
}
function connecting(){
  S.run++;
  show(`<div class="in center"><div class="big-ic" style="background:var(--rose-soft);color:var(--rose)">♡</div>
    <h1 class="hello" style="font-size:25px">Connecting you to a counsellor</h1>
    <p class="muted">Someone from our on-call team will join in a few minutes. Stay with us.</p>
    <div class="card" style="text-align:left"><span class="typing"><i></i><i></i><i></i></span><div class="small muted" style="margin-top:6px">While you wait: breathe in for 4, out for 6.</div></div>
    <p class="small muted" style="margin-top:14px">Prototype: in the real app a counsellor picks this up.</p></div>`);
}
function sheet(html){ const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim'; s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; s.onclick = e => { if (e.target === s) closeSheet(); }; $('#phone').appendChild(s); }
function closeSheet(){ $('#scrim')?.remove(); }
function humanSheet(){
  sheet(`<h2 style="font-size:21px">Talk to a person</h2><p class="muted" style="margin:6px 0 4px">Free and private.</p>
    <button class="opt" onclick="closeSheet();connecting()"><span class="dot k-selfhelp">💬</span><div><b>Chat with a counsellor now</b><span>Usually under 10 minutes</span></div></button>
    <a class="opt" href="tel:14416"><span class="dot k-counsellor">☎</span><div><b>Tele-MANAS 14416</b><span>Free, 24×7</span></div></a>`);
}

/* ---------- side panel ---------- */
document.querySelectorAll('.sample').forEach(b => b.onclick = () => chat(b.dataset.s));
$('#reset').onclick = () => { S = { history:[], rec:null, plan:null, run:S.run + 1, thumbsDown:0 }; home(); };
$('#theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
home();
</script>
</body>
</html>
